# Eval cases for this skill, run by `python -m orchestrator eval` with evals/cases.yaml.
- name: health-check-reads-facts-for-the-site
  prompt: Run a health check on the Colombo devices.
  devices: [{name: core-sw1, site: colombo}, {name: core-sw2, site: colombo}, {name: edge-r1, site: dubai}]
  results:
    ansible.facts.read:
      core-sw1: {status: ok, facts: {hostname: core-sw1, os_version: "17.9.4a", model: C9300, serial: FOC1}}
      core-sw2: {status: unreachable, error: timed out}
  expect: [inventory.devices.list, ansible.facts.read]
  never: [ansible.playbook.run, cloud.module.apply]
  answer_has: [core-sw2]
