name: ansible
version: 0.2.0
capabilities:
  - id: ansible.facts.read
    kind: read
    risk: low
    handler: read_facts
    description: Read basic facts (hostname, OS or network OS version, model, serial) from inventory devices through the Ansible executor.
    params:
      type: object
      properties:
        devices: {type: array, items: {type: string}, description: Device names from the inventory, at most 50.}
      required: [devices]
      additionalProperties: false
  - id: ansible.playbooks.list
    kind: read
    risk: low
    handler: list_playbooks
    description: List the reviewed playbooks the Ansible executor can run, with what each does, the variables it takes and whether it can be backed out.
    params: {type: object, properties: {}, additionalProperties: false}
  - id: ansible.playbook.run
    kind: change
    risk: medium            # the floor; no rollback playbook or a critical device raises it
    handler: plan_playbook  # the dry run (check mode with diffs) that people approve
    apply: apply_playbook   # runs only the approved digest, verifies, rolls back on failure
    description: Propose running a reviewed playbook on inventory devices. This only records a dry-run plan with its diff; nothing changes until people approve it and run it.
    params:
      type: object
      properties:
        playbook: {type: string, description: A playbook name from ansible.playbooks.list.}
        devices: {type: array, items: {type: string}, description: Device names from the inventory, at most 50.}
        vars: {type: object, description: "The playbook's variables as ansible.playbooks.list names them, name to plain value."}
      required: [playbook, devices]
      additionalProperties: false
