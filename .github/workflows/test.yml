# The test suite on GitHub's hosted runners (free for a public repository). Push only, never pull_request: outside
# pull requests are closed (close-outside-prs.yml) and our own come from branches here, so their pushes are tested.
name: test
on:
  push:
    branches: ["**"]  # tags go through release.yml, which calls this
  workflow_call:  # release.yml runs it before publishing images
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: orch
        ports: ["55440:5432"]
        options: --health-cmd "pg_isready -U owner" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements.dev.txt
      - name: Test
        env:
          ORCH_TEST_DB_URL: postgresql://owner:ci-only-password@127.0.0.1:55440/orch
        run: .venv/bin/pytest -q
